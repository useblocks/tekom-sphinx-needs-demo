"$schema" = "https://ubcode.useblocks.com/ubproject.schema.json"

# Sphinx-Needs-Konfiguration im TOML-Format.
# Eingebunden per `needs_from_toml = "ubproject.toml"` in conf.py.
# Deklarative Konfiguration statt Python: lesbar, und ubCode kann sie direkt verwenden.
# Aufbau wie im Schwesterprojekt ../sphinx-needs-demo/docs/ubproject.toml

[project]
name = "BrewMaster Pro 3000 – Benutzerhandbuch"
description = "Benutzerdokumentation zum Kaffeevollautomaten BrewMaster Pro 3000"
srcdir = "."

[server]
index_on_save = true

###############################################################################
# Quellen und Parser
###############################################################################

# Ohne diese Tabelle parst ubCode jede Datei als reStructuredText und sucht
# beim Entdecken nur nach *.rst — das Handbuch besteht aber ausschliesslich
# aus Markdown, und die Vorschau bliebe leer.
# Sobald eine [parse.parsers.*]-Tabelle existiert, ist die Liste der Parser
# vollstaendig. Ein reiner Markdown-Eintrag genuegt, weil es keine RST-Dateien
# gibt; kaemen welche dazu, muesste zusaetzlich [parse.parsers.rst] stehen.
# colon_fence spiegelt myst_enable_extensions aus conf.py.
[parse.parsers.md]
flavour = "myst"
extensions = ["colon_fence"]

# Sphinx haelt _data ueber exclude_patterns aus dem Build heraus. ubCode
# braucht denselben Ausschluss, sonst zaehlt _data/varianten/README.md als
# Quelldatei ohne toctree-Eintrag.
[source]
extend_exclude = ["_data"]

# Alle Needs-Konfigurationen stehen in der needs-Tabelle.
# Die Schlüssel tragen dabei kein needs_-Präfix.
[needs]
build_json = true

# IDs werden von Hand vergeben. Sonst leitet Sphinx-Needs sie aus dem Titel ab,
# und eine Titeländerung zerreißt alle Verknüpfungen.
id_required = true
id_regex = "[A-Z][A-Z0-9_]{2,40}"

# Diagramme über Graphviz statt PlantUML: kein Java, schnelle Builds.
flow_engine = "graphviz"

# Im Fließtext steht der Begriff, nicht die ID. Default wäre "{{ title }} ({{ id }})",
# und "Bypass (GLOSS_BYPASS)" liest sich in einem Benutzerhandbuch schlecht.
role_need_template = "{{ title }}"

# Schema-Validierung
# https://sphinx-needs.readthedocs.io/en/latest/schema/index.html
schema_definitions_from_json = "schemas.json"

# Benannter Importschlüssel, damit in der Quelldatei kein Pfad steht.
[needs.import_keys]
gefaehrdungen = "/_data/gefaehrdungen.json"

###############################################################################
# Need-Typen
###############################################################################

[[needs.types]]
directive = "term"
title = "Glossareintrag"
prefix = "GLOSS_"
color = "#5DADE2"
style = "node"

[[needs.types]]
directive = "warn"
title = "Warnhinweis"
prefix = "WARN_"
color = "#F5B041"
style = "node"

# Identisch zur Definition im Schwesterprojekt, damit eine Gefährdung
# in beiden Projekten gleich aussieht.
[[needs.types]]
directive = "hazard"
title = "Gefährdung"
prefix = "HAZ_"
color = "#DC143C"
style = "node"

[[needs.types]]
directive = "proc"
title = "Handlungsanweisung"
prefix = "PROC_"
color = "#58D68D"
style = "node"

[[needs.types]]
directive = "feature"
title = "Produktmerkmal"
prefix = "FEAT_"
color = "#AF7AC5"
style = "node"

[[needs.types]]
directive = "variant"
title = "Produktvariante"
prefix = "VAR_"
color = "#85929E"
style = "node"

# Kein Typ des Handbuchs, sondern die Klammer um alles, was aus dem
# Entwicklungsprojekt herüberreicht. Es gibt dafuer keine Direktive:
# Objekte dieses Typs entstehen ausschließlich aus external_needs.
[[needs.types]]
directive = "extern"
title = "Objekt im Entwicklungsprojekt"
prefix = "EXT_"
color = "#2d86c1"
style = "node"

###############################################################################
# Darstellung
###############################################################################

# Ein Warnhinweis zeigt Warnsymbol und Signalwort im Kopf, wie es der
# Redaktionsleitfaden verlangt. Die Verknüpfungen von Warnhinweisen und
# Handlungsanweisungen stehen eingeklappt darunter, der Pfeil öffnet sie.
# So sieht das Handbuch aus wie ein Handbuch, und die Daten bleiben erreichbar.
[needs.fields.layout]
predicates = [["type == 'warn'", "warnhinweis"]]

[needs.fields.collapse]
predicates = [["type in ['warn', 'proc']", true]]

[needs.layouts.warnhinweis]
grid = "simple"

[needs.layouts.warnhinweis.layout]
head = [
  '⚠ **<<meta("signalwort")>>** **<<meta("title")>>** <<meta_id()>> <<collapse_button("meta", collapsed="icon:arrow-down-circle", visible="icon:arrow-right-circle", initial=False)>>',
]
meta = [
  '<<meta_all(no_links=True, exclude=["signalwort", "layout"])>>',
  '<<meta_links_all()>>',
]

###############################################################################
# Felder
###############################################################################

# Signalwort nach ISO 3864 / ANSI Z535.
# Absichtlich nicht "severity": im Schwesterprojekt ist das die HARA-Einstufung,
# und Feldschemas gelten projektweit für jeden Need, der das Feld setzt.
[needs.fields.signalwort]
description = "Signalwort des Warnhinweises"
nullable = true
# Die erlaubten Werte prüft die Regel warn-braucht-signalwort in schemas.json.
# Ein Enum an dieser Stelle würde jeden Fehler ein zweites Mal melden,
# und zwar mit einer englischen Meldung.

[needs.fields.autor]
description = "Verantwortliche Redakteurin oder Redakteur"
nullable = true

[needs.fields.geprueft_am]
description = "Datum der letzten fachlichen Prüfung"
nullable = true

[needs.fields.quelltyp]
description = "Artefaktart im Entwicklungsprojekt"
nullable = true

# Feld mit Variantenauflösung: <{ var.produkt.name }>
[needs.fields.geraet]
description = "Gerätebezeichnung der gebauten Variante"
nullable = true
parse_variants = true

###############################################################################
# Verknüpfungen
###############################################################################

[needs.links.covers]
outgoing = "deckt ab"
incoming = "wird abgedeckt durch"
color = "#DC143C"

[needs.links.warns]
outgoing = "Sicherheitshinweise"
incoming = "gilt für"
color = "#F5B041"

# Der Default wird über predicates gesetzt, nicht als Feld-Default.
# Gleiches Muster wie tr_link an [needs.links.runs] im Schwesterprojekt.
[needs.links.mentions]
outgoing = "erwähnt"
incoming = "wird erwähnt in"
color = "#5DADE2"
predicates = [["type == 'proc'", "[[links_from_content()]]"]]

[needs.links.requires]
outgoing = "benötigt"
incoming = "benötigt für"
color = "#AF7AC5"

[needs.links.has_features]
outgoing = "Ausstattung"
incoming = "enthalten in"
color = "#85929E"

# Die Brücke zum Entwicklungsprojekt derselben Maschine.
# Die Datei ist ein eingecheckter Auszug aus ../sphinx-needs-demo, erzeugt von
# `make sw-projekt`. Zur Bauzeit wird das Nachbarrepo nicht gebraucht.
[needs.links.realisiert_durch]
outgoing = "realisiert durch"
incoming = "beschrieben in"
color = "#2d86c1"

[[needs.external_needs]]
json_path = "./_data/sw-projekt.json"
base_url = "https://sphinx-needs-demo.readthedocs.io/en/latest"
target_url = "{{need['docname']}}.html#{{need['id']}}"
