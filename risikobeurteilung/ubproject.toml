"$schema" = "https://ubcode.useblocks.com/ubproject.schema.json"

[project]
name = "BrewMaster Pro 3000 – Risikobeurteilung"
description = "Gefährdungsliste nach ISO 12100"
srcdir = "."

# Wie im Handbuch: ohne deklarierten Markdown-Parser sieht ubCode nur *.rst
# und die Vorschau bliebe leer.
[parse.parsers.md]
flavour = "myst"
extensions = ["colon_fence"]

[needs]
# Erzeugt _build/html/needs.json. Genau diese Datei wandert ins Handbuch.
build_json = true
id_required = true
id_regex = "[A-Z][A-Z0-9_]{2,40}"
flow_engine = "graphviz"

# Zeichengleich mit der Definition im Handbuch und im Schwesterprojekt
# ../sphinx-needs-demo/docs/ubproject.toml
[[needs.types]]
directive = "hazard"
title = "Gefährdung"
prefix = "HAZ_"
color = "#DC143C"
style = "node"
